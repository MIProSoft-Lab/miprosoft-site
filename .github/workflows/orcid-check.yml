name: Check ORCID records

# Finds articles a member co-authors that are missing from their ORCID record
# (see scripts/check-orcid.mjs). Members with a `github:` user in
# site.config.yaml get an issue assigned to them, kept up to date and closed
# when fixed; the rest get a warning in the run's log and summary. Runs on the
# committed data, after each weekly ORCID update, and whenever the data or the
# members change.

on:
  workflow_run:
    workflows: [Update from ORCID and deploy]
    types: [completed]
  push:
    branches: [main]
    paths:
      - data/orcid/**
      - data/works.json
      - data/people/**
      - site.config.yaml
      - scripts/check-orcid.mjs
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # open, update and close the "orcid" issues

# One run at a time, so two runs never open the same issue twice.
concurrency:
  group: orcid-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # After the weekly update, check out the data it just committed.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check every co-authored article is in each member's ORCID
        run: node scripts/check-orcid.mjs --issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
