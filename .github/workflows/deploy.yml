name: Update from ORCID and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'   # every Monday, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed data/orcid/, data/works.json and data/jcr.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Skip everything until GitHub Pages is set up for this repo with
  # Settings → Pages → Source: "GitHub Actions" (e.g. while the repo is private
  # on a plan without Pages, or before you're ready to publish).
  check-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null); then
            if [ "$build_type" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            msg="GitHub Pages is set to deploy from a branch. Change Settings → Pages → Source to \"GitHub Actions\" to publish the site."
          else
            msg="GitHub Pages is not set up for this repository, so the site is not built or published. Enable it in Settings → Pages → Source: \"GitHub Actions\"."
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Site not published::$msg"
          echo "### Site not published" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check-pages
    if: needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # If ORCID or Crossref is unreachable, keep going with the committed data.
      - name: Fetch ORCID records and article data
        id: fetch
        continue-on-error: true
        run: npm run fetch
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}

      # Impact factors from the Clarivate Journals API; skipped without the secret.
      - name: Fetch JCR impact factors
        continue-on-error: true
        run: npm run fetch:jcr
        env:
          CLARIVATE_API_KEY: ${{ secrets.CLARIVATE_API_KEY }}

      - name: Commit updated data
        if: steps.fetch.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain -- data/orcid data/works.json data/jcr.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/orcid data/works.json $(ls data/jcr.json 2>/dev/null)
            git commit -m "Update ORCID data"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
