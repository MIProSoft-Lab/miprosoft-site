  summary: Un mapa interactivo del modelo de referencia de procesos para aplicaciones de Aprendizaje Automático, para explorar sus procesos y construir un modelo de ciclo de vida adaptado a cada proyecto.
  body: |
    MLProcessMap es una herramienta web para explorar el modelo de referencia de procesos (PRM) para el Aprendizaje Automático desarrollado en una tesis doctoral en la Universitat de les Illes Balears. Siguiendo las normas ISO/IEC 33004 e ISO/IEC/IEEE 24774, el PRM se centra en los procesos técnicos y especifica cada uno con su propósito, resultados, actividades, entradas y salidas. Mantiene los nombres y la estructura de las normas ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 e ISO/IEC 5338, de modo que pueden usarse de forma complementaria.

    Es de uso libre y está disponible en inglés, catalán y castellano. Ayuda a:

    - **Las empresas** que desarrollan sistemas de Aprendizaje Automático a definir, evaluar y mejorar su proceso de desarrollo, y a adaptar un ciclo de vida a cada proyecto.
    - **El profesorado y el alumnado** a aprender cómo se organiza un proyecto de Aprendizaje Automático, desde el análisis de negocio hasta la operación y el mantenimiento, proceso a proceso.

    ![El mapa de procesos de la segunda versión del PRM](process-map.png)

    *El mapa de procesos: cada proceso tiene el color de su origen (normas y literatura, solo normas, o descompuesto de un proceso de una norma).*

    ## Qué puedes hacer

    - **Explorar el mapa de procesos** de cada versión del PRM y cada proceso.
    - **Seguir los productos de trabajo**: qué proceso produce cada entrada y qué procesos usan cada salida.
    - **Comparar versiones** de procesos del PRM.
    - **Construir un modelo de ciclo de vida adaptado** a un proyecto: elegir los procesos y las actividades, organizarlos en fases con repeticiones y ciclos, y exportarlo para compartirlo.
    - **Imprimir** el PRM, o un solo proceso, o guardarlo como PDF.

    ## Cómo citarla

    Si usas esta herramienta, cita la tesis:

    ```cite
    @phdthesis{crespi2027prm,
      author = {Crespí Tobeña, Antonio},
      title  = {A Process Reference Model for Machine Learning Applications},
      school = {Universitat de les Illes Balears},
      year   = {2027}
    }
    ```

    El contenido del PRM tiene una licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), y el código fuente de la web, la licencia MIT.
