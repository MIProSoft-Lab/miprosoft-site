  summary: Un mapa interactivo del Modelo de Referencia de Procesos (PRM) para el Aprendizaje Automático, para explorar sus procesos y construir un modelo de ciclo de vida para tu propio proyecto.
  body: |
    MLProcessMap es una web para explorar el Modelo de Referencia de Procesos (PRM) para el Aprendizaje Automático desarrollado en una tesis doctoral en la Universitat de les Illes Balears. Siguiendo las normas ISO/IEC 33004 e ISO/IEC/IEEE 24774, el PRM se centra en los procesos técnicos y especifica cada uno con su propósito, resultados, actividades, entradas y salidas. Mantiene los nombres y la estructura de las normas ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 e ISO/IEC 5338, de modo que puede usarse junto con ellas.

    Es de uso libre, no necesita cuenta y está disponible en inglés, catalán y castellano. Ayuda a:

    - **Las empresas** que desarrollan sistemas de Aprendizaje Automático a definir, evaluar y mejorar su proceso de desarrollo, y a adaptar un ciclo de vida a cada proyecto.
    - **El profesorado y el alumnado** a aprender cómo se organiza un proyecto de Aprendizaje Automático, desde el análisis de negocio hasta la operación y el mantenimiento, proceso a proceso.

    ![El mapa de procesos de la segunda versión del PRM](process-map.png)

    *El mapa de procesos: cada proceso tiene el color de su origen (normas y literatura, solo normas, o descompuesto de un proceso de una norma).*

    ## Qué puedes hacer

    - **Explorar el mapa de procesos** de cada versión del PRM, con búsqueda de texto completo, y leer cada proceso: propósito, resultados, entradas, salidas, actividades, las fuentes de cada actividad y su trazabilidad a las normas ISO/IEC.
    - **Seguir los productos de trabajo**: qué proceso produce cada entrada y qué procesos usan cada salida.
    - **Comparar versiones** del PRM, palabra por palabra.
    - **Construir un modelo de ciclo de vida** para un proyecto: elegir los procesos y las actividades, organizarlos en fases con repeticiones y retroalimentaciones, ver las entradas que quedan sin productor, y exportarlo como lista de comprobación en Markdown, CSV, JSON o YAML, o imprimirlo.
    - **Imprimir** una versión del PRM, o un solo proceso, o guardarlo como PDF, con casillas para marcar y espacio para notas.

    ## Primeros pasos

    1. Abre MLProcessMap y elige tu idioma.
    2. Explora el mapa de procesos y abre los procesos que te interesen.
    3. Empieza desde una plantilla de ciclo de vida, o desde cero, en **Crear un ciclo de vida**, y exporta o imprime el resultado.

    ## Cómo citarla

    Si usas el PRM, cita la tesis:

    > Crespí Tobeña, A. (2027). *A Process Reference Model for Machine Learning Applications* [Tesis doctoral, Universitat de les Illes Balears].

    El contenido del PRM tiene una licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), y el código fuente de la web, la licencia MIT.
