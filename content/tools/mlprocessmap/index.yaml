  summary: An interactive map of the Process Reference Model (PRM) for Machine Learning, to explore its processes and build a lifecycle model for your own project.
  body: |
    MLProcessMap is a website to explore the Process Reference Model (PRM) for Machine Learning developed in a doctoral thesis at the Universitat de les Illes Balears. Following ISO/IEC 33004 and ISO/IEC/IEEE 24774, the PRM focuses on the technical processes and specifies each one with its purpose, outcomes, activities, inputs and outputs. It keeps the names and structure of ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 and ISO/IEC 5338, so it can be used alongside them.

    It is free to use, needs no account, and is available in English, Catalan and Spanish. It helps:

    - **Companies** that build Machine Learning systems define, assess and improve their development process, and tailor a lifecycle to each project.
    - **Teachers and students** learn how a Machine Learning project is organised, from the business analysis to operation and maintenance, process by process.

    ![The process map of the second version of the PRM](process-map.png)

    *The process map: each process is coloured by origin (standards and literature, standards only, or decomposed from a standard process).*

    ## What you can do

    - **Explore the process map** of each version of the PRM, with full-text search, and read each process: purpose, outcomes, inputs, outputs, activities, the sources of each activity and its traceability to the ISO/IEC standards.
    - **Follow the work products**: which process produces each input and which processes use each output.
    - **Compare versions** of the PRM, word by word.
    - **Build a lifecycle model** for a project: choose the processes and activities, arrange them into phases with repetitions and feedback loops, see the inputs left without a producer, and export it as a Markdown checklist, CSV, JSON or YAML, or print it.
    - **Print** a version of the PRM, or a single process, or save it as a PDF, with boxes to tick and space for notes.

    ## Getting started

    1. Open MLProcessMap and choose your language.
    2. Explore the process map and open the processes that interest you.
    3. Start from a lifecycle template, or from scratch, in **Build a lifecycle**, and export or print the result.

    ## How to cite

    If you use the PRM, cite the thesis:

    > Crespí Tobeña, A. (2027). *A Process Reference Model for Machine Learning Applications* [Doctoral thesis, Universitat de les Illes Balears].

    The content of the PRM is licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), and the source code of the website under the MIT License.
