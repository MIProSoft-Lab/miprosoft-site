  summary: Un mapa interactiu del model de referència de processos per aplicacions d'Aprenentatge Automàtic, per explorar-ne els processos i construir un model de cicle de vida adaptats a cada projecte.
  body: |
    MLProcessMap és un eina web per explorar el model de referència de processos (PRM) per a l'Aprenentatge Automàtic desenvolupat en una tesi doctoral a la Universitat de les Illes Balears. Seguint les normes ISO/IEC 33004 i ISO/IEC/IEEE 24774, el PRM es centra en els processos tècnics i especifica cadascun amb el seu propòsit, resultats, activitats, entrades i sortides. Manté els noms i l'estructura de les normes ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 i ISO/IEC 5338, de manera que es poden fer servir de forma complementaria.

    És d'ús lliure i està disponible en anglès, català i castellà. Ajuda:

    - **Les empreses** que desenvolupen sistemes d'Aprenentatge Automàtic a definir, avaluar i millorar el seu procés de desenvolupament, i a adaptar un cicle de vida a cada projecte.
    - **El professorat i l'alumnat** a aprendre com s'organitza un projecte d'Aprenentatge Automàtic, des de l'anàlisi de negoci fins a l'operació i el manteniment, procés a procés.

    ![El mapa de processos de la segona versió del PRM](process-map.png)

    *El mapa de processos: cada procés té el color del seu origen (normes i literatura, només normes, o descompost d'un procés d'una norma).*

    ## Què hi podeu fer

    - **Explorar el mapa de processos** de cada versió del PRM i cada procés.
    - **Seguir els productes de treball**: quin procés produeix cada entrada i quins processos fan servir cada sortida.
    - **Comparar versions** de processos del PRM.
    - **Construir un model de cicle de vida adaptat** a un projecte: triar els processos i les activitats, organitzar-los en fases amb repeticions i cicles, i exportar-lo per compartir.
    - **Imprimir** el PRM, o un sol procés, o desar-lo com a PDF.

    ## Com citar-la

    Si feu servir aquesta eina, citau la tesi:

    ```cite
    @phdthesis{crespi2027prm,
      author = {Crespí Tobeña, Antonio},
      title  = {A Process Reference Model for Machine Learning Applications},
      school = {Universitat de les Illes Balears},
      year   = {2027}
    }
    ```

    El contingut del PRM té una llicència [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), i el codi font del web, la llicència MIT.
