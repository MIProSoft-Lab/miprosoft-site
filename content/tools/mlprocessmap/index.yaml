  summary: Un mapa interactiu del Model de Referència de Processos (PRM) per a l'Aprenentatge Automàtic, per explorar-ne els processos i construir un model de cicle de vida per al vostre projecte.
  body: |
    MLProcessMap és un web per explorar el Model de Referència de Processos (PRM) per a l'Aprenentatge Automàtic desenvolupat en una tesi doctoral a la Universitat de les Illes Balears. Seguint les normes ISO/IEC 33004 i ISO/IEC/IEEE 24774, el PRM se centra en els processos tècnics i especifica cadascun amb el seu propòsit, resultats, activitats, entrades i sortides. Manté els noms i l'estructura de les normes ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 i ISO/IEC 5338, de manera que es pot fer servir juntament amb elles.

    És d'ús lliure, no necessita cap compte i està disponible en anglès, català i castellà. Ajuda:

    - **Les empreses** que desenvolupen sistemes d'Aprenentatge Automàtic a definir, avaluar i millorar el seu procés de desenvolupament, i a adaptar un cicle de vida a cada projecte.
    - **El professorat i l'alumnat** a aprendre com s'organitza un projecte d'Aprenentatge Automàtic, des de l'anàlisi de negoci fins a l'operació i el manteniment, procés a procés.

    ![El mapa de processos de la segona versió del PRM](process-map.png)

    *El mapa de processos: cada procés té el color del seu origen (normes i literatura, només normes, o descompost d'un procés d'una norma).*

    ## Què hi podeu fer

    - **Explorar el mapa de processos** de cada versió del PRM, amb cerca de text complet, i llegir cada procés: propòsit, resultats, entrades, sortides, activitats, les fonts de cada activitat i la seva traçabilitat a les normes ISO/IEC.
    - **Seguir els productes de treball**: quin procés produeix cada entrada i quins processos fan servir cada sortida.
    - **Comparar versions** del PRM, paraula per paraula.
    - **Construir un model de cicle de vida** per a un projecte: triar els processos i les activitats, organitzar-los en fases amb repeticions i retroaccions, veure les entrades que queden sense productor, i exportar-lo com a llista de comprovació en Markdown, CSV, JSON o YAML, o imprimir-lo.
    - **Imprimir** una versió del PRM, o un sol procés, o desar-lo com a PDF, amb caselles per marcar i espai per a notes.

    ## Primers passos

    1. Obriu MLProcessMap i triau la vostra llengua.
    2. Explorau el mapa de processos i obriu els processos que us interessin.
    3. Començau des d'una plantilla de cicle de vida, o des de zero, a **Crea un cicle de vida**, i exportau o imprimiu el resultat.

    ## Com citar-la

    Si feu servir el PRM, citau la tesi:

    > Crespí Tobeña, A. (2027). *A Process Reference Model for Machine Learning Applications* [Tesi doctoral, Universitat de les Illes Balears].

    El contingut del PRM té una llicència [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), i el codi font del web, la llicència MIT.
