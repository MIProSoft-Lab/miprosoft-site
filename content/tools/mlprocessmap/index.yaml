  summary: An interactive map of the process reference model for Machine Learning applications, to explore its processes and build a lifecycle model tailored to each project.
  body: |
    MLProcessMap is a web tool to explore the process reference model (PRM) for Machine Learning developed in a doctoral thesis at the Universitat de les Illes Balears. Following ISO/IEC 33004 and ISO/IEC/IEEE 24774, the PRM focuses on the technical processes and specifies each one with its purpose, outcomes, activities, inputs and outputs. It keeps the names and structure of ISO/IEC/IEEE 12207, ISO/IEC/IEEE 15288 and ISO/IEC 5338, so they can be used together.

    It is free to use and is available in English, Catalan and Spanish. It helps:

    - **Companies** that build Machine Learning systems define, assess and improve their development process, and tailor a lifecycle to each project.
    - **Teachers and students** learn how a Machine Learning project is organised, from the business analysis to operation and maintenance, process by process.

    ![The process map of the second version of the PRM](process-map.png)

    *The process map: each process is coloured by origin (standards and literature, standards only, or decomposed from a standard process).*

    ## What you can do

    - **Explore the process map** of each version of the PRM, and each process.
    - **Follow the work products**: which process produces each input and which processes use each output.
    - **Compare versions** of the PRM's processes.
    - **Build a tailored lifecycle model** for a project: choose the processes and activities, arrange them into phases with repetitions and cycles, and export it to share it.
    - **Print** the PRM, or a single process, or save it as a PDF.

    ## How to cite

    If you use this tool, cite the thesis:

    ```cite
    @phdthesis{crespi2027prm,
      author = {Crespí Tobeña, Antonio},
      title  = {A Process Reference Model for Machine Learning Applications},
      school = {Universitat de les Illes Balears},
      year   = {2027}
    }
    ```

    The content of the PRM is licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), and the source code of the website under the MIT License.
