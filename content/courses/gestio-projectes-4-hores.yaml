en:
  title: Project Management in 4 Hours
  type: short
  summary: A first contact with project management, showing what it takes to lead a project and the benefits of doing so, from scope, tasks and schedule to the team, budget, risks, quality and control, through a practical case. Participants learn to identify the elements of project management that can be useful in their work and to draw up a project charter. For anyone interested, in any profession or sector.
  instructors:
    - antonia-mas
  hours: 4
  institution: Universitat de les Illes Balears
  onDemand: true
  body: |
    ## Overview

    A first contact with project management: what you need to know to lead a project, and what you gain from doing so. The course shows the advantages of organising your own work, and your organisation, by projects, and helps you recognise which aspects of them you could plan and control.

    Participants learn to:

    - identify the elements of project management that can be useful in their work;
    - draw up a project charter.

    ## Who it is for

    Anyone interested in learning what managing by projects involves, whatever their profession or sector.

    ## Programme

    1. Defining the project scope
    2. Breaking the project down into tasks
    3. Scheduling the activities
    4. Choosing the team that will carry out the tasks
    5. Estimating the budget
    6. Taking the project risks into account
    7. Monitoring the quality of the results
    8. Controlling the execution of the project

    ## Methodology

    The concepts are introduced through a practical case. As a first contact with project management, the course is complemented by all the others, such as the [Intensive Course in Project Management](../curs-intensiu-direccio-projectes/).

    ## For companies

    This course is offered on demand, in-house for companies, and can be adapted to their needs. For more information, write to [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
ca:
  title: La Gestió de Projectes en 4 Hores
  summary: Una primera presa de contacte amb la gestió de projectes, que mostra què cal per dirigir un projecte i quins beneficis aporta, des de l'abast, les tasques i el cronograma fins a l'equip, el pressupost, els riscs, la qualitat i el control, a partir d'un cas pràctic. Els participants aprenen a identificar els elements de la gestió de projectes que els poden ser útils a la seva feina i a elaborar l'acta de constitució d'un projecte. Per a qualsevol persona interessada, de qualsevol professió o sector.
  body: |
    ## Presentació

    Una primera presa de contacte amb la gestió de projectes: què cal saber per dirigir un projecte i què s'hi guanya. El curs mostra els avantatges d'organitzar per projectes la pròpia feina i la de l'organització, i ajuda a reconèixer-ne els aspectes que es podrien planificar i controlar.

    Els participants aprenen a:

    - identificar els elements de la gestió de projectes que els poden ser útils a la seva feina;
    - elaborar l'acta de constitució d'un projecte.

    ## A qui s'adreça

    A qualsevol persona interessada a conèixer en què consisteix la gestió per projectes, sigui quina sigui la seva professió o el seu sector.

    ## Pla d'estudis

    1. Definir l'abast del projecte
    2. Organitzar el projecte en tasques
    3. Distribuir les activitats en el temps
    4. Determinar l'equip que farà les tasques
    5. Calcular el pressupost
    6. Tenir en compte els riscs del projecte
    7. Vigilar la qualitat dels resultats del projecte
    8. Controlar l'execució del projecte

    ## Metodologia

    Els conceptes es presenten a partir d'un cas pràctic. Com que és una primera presa de contacte amb la gestió de projectes, la resta de cursos el complementen, com ara el [Curs Intensiu de Direcció de Projectes](../curs-intensiu-direccio-projectes/).

    ## Per a empreses

    Aquest curs s'ofereix a demanda, a la mateixa empresa, i es pot adaptar a les seves necessitats. Per a més informació, escriviu a [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
es:
  title: La Gestión de Proyectos en 4 Horas
  summary: Una primera toma de contacto con la gestión de proyectos, que muestra qué hace falta para dirigir un proyecto y qué beneficios aporta, desde el alcance, las tareas y el cronograma hasta el equipo, el presupuesto, los riesgos, la calidad y el control, a partir de un caso práctico. Los participantes aprenden a identificar los elementos de la gestión de proyectos que les pueden ser útiles en su trabajo y a elaborar el acta de constitución de un proyecto. Para cualquier persona interesada, de cualquier profesión o sector.
  body: |
    ## Presentación

    Una primera toma de contacto con la gestión de proyectos: qué hay que saber para dirigir un proyecto y qué se gana con ello. El curso muestra las ventajas de organizar por proyectos el propio trabajo y el de la organización, y ayuda a reconocer los aspectos que se podrían planificar y controlar.

    Los participantes aprenden a:

    - identificar los elementos de la gestión de proyectos que les pueden ser útiles en su trabajo;
    - elaborar el acta de constitución de un proyecto.

    ## A quién se dirige

    A cualquier persona interesada en conocer en qué consiste la gestión por proyectos, sea cual sea su profesión o su sector.

    ## Plan de estudios

    1. Definir el alcance del proyecto
    2. Organizar el proyecto en tareas
    3. Distribuir las actividades en el tiempo
    4. Determinar el equipo que realizará las tareas
    5. Calcular el presupuesto
    6. Tener en cuenta los riesgos del proyecto
    7. Vigilar la calidad de los resultados del proyecto
    8. Controlar la ejecución del proyecto

    ## Metodología

    Los conceptos se presentan a partir de un caso práctico. Como es una primera toma de contacto con la gestión de proyectos, el resto de cursos lo complementan, como el [Curso Intensivo de Dirección de Proyectos](../curs-intensiu-direccio-projectes/).

    ## Para empresas

    Este curso se ofrece bajo demanda, en la propia empresa, y se puede adaptar a sus necesidades. Para más información, escribe a [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
