en:
  title: University Microcredential in Project Management
  order: 2
  type: microcredential
  summary: Project management based on the PMBOK® Guide of the Project Management Institute (PMI), from scope, schedule and stakeholders to the team, communications, costs, procurement, risks and quality, with visual Kanban boards and support tools, through to monitoring, change management and closing. Participants prepare the main plans and reports of a project, and complete the more than 35 hours of project management training required for the PMP® certification. For professionals from any sector; no previous training is needed.
  instructors:
    - antonia-mas
    - antoni-mesquida
  guestInstructors:
    - José María Gilabert Flor
  start: 2025-11
  end: 2025-12
  format: in-person
  ects: 5
  hours: 40
  institution: Universitat de les Illes Balears
  url: https://fueib.org/ca/microcredencials/811/formacion/curso/1668/microcredencial-universitaria-en-direccio-de-projectes-5-ects
ca:
  title: Microcredencial Universitària en Direcció de Projectes
  summary: La direcció de projectes segons la Guia del PMBOK® del Project Management Institute (PMI), des de l'abast, el cronograma i els interessats fins a l'equip, les comunicacions, els costs, les adquisicions, els riscs i la qualitat, amb taulers visuals Kanban i eines de suport, fins al seguiment, la gestió de canvis i el tancament. Els participants elaboren els principals plans i informes d'un projecte, i completen les més de 35 hores de formació en gestió de projectes que requereix la certificació PMP®. Per a professionals de qualsevol sector; no cal formació prèvia.
es:
  title: Microcredencial Universitaria en Dirección de Proyectos
  summary: La dirección de proyectos según la Guía del PMBOK® del Project Management Institute (PMI), desde el alcance, el cronograma y los interesados hasta el equipo, las comunicaciones, los costes, las adquisiciones, los riesgos y la calidad, con tableros visuales Kanban y herramientas de apoyo, hasta el seguimiento, la gestión de cambios y el cierre. Los participantes elaboran los principales planes e informes de un proyecto, y completan las más de 35 horas de formación en gestión de proyectos que requiere la certificación PMP®. Para profesionales de cualquier sector; no se necesita formación previa.
