en:
  title: Tools to Optimise My Work
  type: short
  summary: Simple tools to plan, assign and track tasks, on your own or in a team, and to share documents, opinions and results, on any current device. It covers setting up a productive work environment, collaborative work, shared task lists and calendars, progress tracking, and communication and video-conferencing tools. For anyone, in any profession or sector, who wants to get the most out of their devices.
  instructors:
    - antoni-mesquida
  hours: 8
  institution: Universitat de les Illes Balears
  onDemand: true
  body: |
    ## Overview

    With so many new apps and online services, it is hard to know which tools suit your work best. This course presents simple tools to manage work effectively, which run on any current device: to plan, assign and track tasks, on your own or in a team, and to share documents, opinions and results.

    ## Who it is for

    Anyone who wants to get the most out of their electronic devices, whatever their profession or sector.

    ## Programme

    1. Setting up a productive work environment
    2. Collaborative work tools
    3. Defining and assigning task lists and events in shared calendars
    4. Planning and tracking the progress of tasks
    5. Communication and video-conferencing tools

    ## Methodology

    The tools are presented on participants' own devices: laptop, tablet or smartphone.

    ## For companies

    This course is offered on demand, in-house for companies, and can be adapted to their needs. For more information, write to [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
ca:
  title: Eines per a Optimitzar la Meva Feina
  summary: Eines senzilles per planificar, assignar i fer el seguiment de tasques, de manera individual o en equip, i per compartir documents, opinions i resultats, des de qualsevol dispositiu actual. Tracta la configuració d'un entorn de treball productiu, el treball col·laboratiu, les llistes de tasques i els calendaris compartits, el seguiment de l'avanç i les eines de comunicació i videoconferència. Per a qualsevol persona, de qualsevol professió o sector, que vulgui treure el màxim profit dels seus dispositius.
  body: |
    ## Presentació

    Amb tantes aplicacions i serveis en línia nous, és difícil saber quines eines s'adapten millor a la nostra feina. Aquest curs presenta eines senzilles per gestionar la feina de manera eficaç, que funcionen en qualsevol dispositiu actual: per planificar, assignar i fer el seguiment de tasques, de manera individual o en equip, i per compartir documents, opinions i resultats.

    ## A qui s'adreça

    A qualsevol persona que vulgui treure el màxim profit dels seus dispositius electrònics, sigui quina sigui la seva professió o el seu sector.

    ## Pla d'estudis

    1. Configuració d'un entorn de treball productiu
    2. Eines de treball col·laboratiu
    3. Definició i assignació de llistes de tasques i d'esdeveniments en calendaris compartits
    4. Planificació i seguiment de l'avanç de les tasques
    5. Eines de comunicació i videoconferència

    ## Metodologia

    Les eines es presenten en els dispositius dels mateixos participants: ordinador portàtil, tauleta o telèfon intel·ligent.

    ## Per a empreses

    Aquest curs s'ofereix a demanda, a la mateixa empresa, i es pot adaptar a les seves necessitats. Per a més informació, escriviu a [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
es:
  title: Herramientas para Optimizar mi Trabajo
  summary: Herramientas sencillas para planificar, asignar y hacer el seguimiento de tareas, de forma individual o en equipo, y para compartir documentos, opiniones y resultados, desde cualquier dispositivo actual. Trata la configuración de un entorno de trabajo productivo, el trabajo colaborativo, las listas de tareas y los calendarios compartidos, el seguimiento del avance y las herramientas de comunicación y videoconferencia. Para cualquier persona, de cualquier profesión o sector, que quiera sacar el máximo partido a sus dispositivos.
  body: |
    ## Presentación

    Con tantas aplicaciones y servicios en línea nuevos, es difícil saber qué herramientas se adaptan mejor a nuestro trabajo. Este curso presenta herramientas sencillas para gestionar el trabajo de forma eficaz, que funcionan en cualquier dispositivo actual: para planificar, asignar y hacer el seguimiento de tareas, de forma individual o en equipo, y para compartir documentos, opiniones y resultados.

    ## A quién se dirige

    A cualquier persona que quiera sacar el máximo partido a sus dispositivos electrónicos, sea cual sea su profesión o su sector.

    ## Plan de estudios

    1. Configuración de un entorno de trabajo productivo
    2. Herramientas de trabajo colaborativo
    3. Definición y asignación de listas de tareas y de eventos en calendarios compartidos
    4. Planificación y seguimiento del avance de las tareas
    5. Herramientas de comunicación y videoconferencia

    ## Metodología

    Las herramientas se presentan en los dispositivos de los propios participantes: ordenador portátil, tableta o teléfono inteligente.

    ## Para empresas

    Este curso se ofrece bajo demanda, en la propia empresa, y se puede adaptar a sus necesidades. Para más información, escribe a [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
