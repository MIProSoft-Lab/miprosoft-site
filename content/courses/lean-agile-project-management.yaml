en:
  title: Lean & Agile Project Management
  type: short
  summary: The basic principles and techniques of Lean and Agile project management, applicable in any field or sector, to lead and take part in projects that deliver results continuously, in less time and at a lower cost, with the customer as the top priority. Taught through practical group exercises on case studies. For anyone with a basic knowledge of project management.
  instructors:
    - antonia-mas
    - antoni-mesquida
  guestInstructors:
    - José María Gilabert Flor
  hours: 32
  institution: Universitat de les Illes Balears
  onDemand: true
  body: |
    ## Overview

    Project management is shifting towards satisfying the customer, embracing change as a competitive advantage, and delivering results continuously and as soon as possible. This course introduces the basic principles and techniques of Lean and Agile project management, applicable in any field or sector, to find new ways of leading and taking part in projects that deliver results in less time and at a lower cost, with the customer as the top priority.

    Participants learn principles, techniques and skills to collaborate, motivate and communicate better, and to deliver the expected results in the least time, at the lowest cost and with higher quality.

    ## Who it is for

    Anyone who wants to learn and make the most of Lean and Agile project management techniques, whatever their profession or sector. A basic knowledge of project management is needed.

    ## Programme

    1. Agile management versus waterfall life cycles
    2. Agile management applied to project management
    3. Lean management applied to project management
    4. Principles and techniques to apply
    5. Roles and responsibilities
    6. Available methodologies and tools

    ## Methodology

    Participants work in groups on many practical exercises, applying the principles, concepts and techniques to several case studies.

    ## For companies

    This course is offered on demand, in-house for companies, and can be adapted to their needs. For more information, write to [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
ca:
  title: Lean & Agile Project Management
  summary: Els principis i les tècniques bàsiques de la direcció de projectes Lean i Agile, aplicables a qualsevol àmbit o sector, per dirigir projectes i participar-hi lliurant resultats de manera contínua, en menys temps i amb menys cost, amb el client com a prioritat. S'imparteix amb exercicis pràctics en grup sobre casos d'estudi. Per a qualsevol persona amb uns coneixements mínims de direcció de projectes.
  body: |
    ## Presentació

    La direcció de projectes s'orienta cada vegada més a satisfer el client, a acceptar el canvi com un avantatge competitiu i a lliurar resultats de manera contínua i com més aviat millor. Aquest curs presenta els principis i les tècniques bàsiques de la direcció de projectes Lean i Agile, aplicables a qualsevol àmbit o sector, per trobar noves maneres de dirigir projectes i de participar-hi que donin resultats en menys temps i amb menys cost, amb el client com a prioritat.

    Els participants aprenen principis, tècniques i habilitats per col·laborar, motivar i comunicar-se millor, i per lliurar els resultats esperats en el mínim temps, amb el mínim cost i amb més qualitat.

    ## A qui s'adreça

    A qualsevol persona que vulgui aprendre i treure profit de les tècniques de direcció de projectes Lean i Agile, sigui quina sigui la seva professió o el seu sector. Cal tenir uns coneixements mínims de direcció de projectes.

    ## Pla d'estudis

    1. L'Agile Management davant els cicles de vida en cascada
    2. L'Agile Management aplicat a la direcció de projectes
    3. El Lean Management aplicat a la direcció de projectes
    4. Principis i tècniques per aplicar
    5. Rols i perfils de responsabilitat
    6. Metodologies i eines disponibles

    ## Metodologia

    Els participants fan en grup molts d'exercicis pràctics, en què apliquen els principis, els conceptes i les tècniques a diversos casos d'estudi.

    ## Per a empreses

    Aquest curs s'ofereix a demanda, a la mateixa empresa, i es pot adaptar a les seves necessitats. Per a més informació, escriviu a [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
es:
  title: Lean & Agile Project Management
  summary: Los principios y las técnicas básicas de la dirección de proyectos Lean y Agile, aplicables a cualquier ámbito o sector, para dirigir proyectos y participar en ellos entregando resultados de forma continua, en menos tiempo y con menos coste, con el cliente como prioridad. Se imparte con ejercicios prácticos en grupo sobre casos de estudio. Para cualquier persona con unos conocimientos mínimos de dirección de proyectos.
  body: |
    ## Presentación

    La dirección de proyectos se orienta cada vez más a satisfacer al cliente, a aceptar el cambio como una ventaja competitiva y a entregar resultados de forma continua y lo antes posible. Este curso presenta los principios y las técnicas básicas de la dirección de proyectos Lean y Agile, aplicables a cualquier ámbito o sector, para encontrar nuevas formas de dirigir proyectos y de participar en ellos que den resultados en menos tiempo y con menos coste, con el cliente como prioridad.

    Los participantes aprenden principios, técnicas y habilidades para colaborar, motivar y comunicarse mejor, y para entregar los resultados esperados en el mínimo tiempo, con el mínimo coste y con más calidad.

    ## A quién se dirige

    A cualquier persona que quiera aprender y sacar partido de las técnicas de dirección de proyectos Lean y Agile, sea cual sea su profesión o su sector. Se necesitan unos conocimientos mínimos de dirección de proyectos.

    ## Plan de estudios

    1. El Agile Management frente a los ciclos de vida en cascada
    2. El Agile Management aplicado a la dirección de proyectos
    3. El Lean Management aplicado a la dirección de proyectos
    4. Principios y técnicas para aplicar
    5. Roles y perfiles de responsabilidad
    6. Metodologías y herramientas disponibles

    ## Metodología

    Los participantes hacen en grupo numerosos ejercicios prácticos, en los que aplican los principios, los conceptos y las técnicas a varios casos de estudio.

    ## Para empresas

    Este curso se ofrece bajo demanda, en la propia empresa, y se puede adaptar a sus necesidades. Para más información, escribe a [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
