en:
  title: Intensive Course in Project Management
  type: short
  summary: A 36-hour introduction to project management based on the PMBOK® Guide of the Project Management Institute (PMI), from scope, tasks and schedule to the team, budget, risks and quality, taught through a practical case. It provides the more than 35 hours of project management training required for the PMP® certification. For professionals with or without previous experience in project management, and can be adapted for companies.
  instructors:
    - antonia-mas
    - antoni-mesquida
  guestInstructors:
    - José María Gilabert Flor
  hours: 36
  institution: Universitat de les Illes Balears
  onDemand: true
  body: |
    ## Overview

    An intensive course on the fundamentals of project management, following the PMBOK® Guide of the Project Management Institute (PMI). Participants learn the tools and techniques to manage a project's resources, deadlines and costs more efficiently. With its 36 hours, the course also accredits the more than 35 hours of project management training required to apply for the PMP® professional certification.

    ## Who it is for

    Any professional who wants to become a project manager or who has management responsibilities. It is useful both for those with no experience in project management and for those who already work in the field.

    ## Programme

    1. Defining the project scope
    2. Breaking the project down into tasks
    3. Scheduling the activities
    4. Building the team
    5. Estimating the budget
    6. Assessing the project risks
    7. Monitoring the quality of the results

    ## Methodology

    The concepts are introduced through a practical case. The seminars *The art of negotiation* (4 hours) and [*Tools to optimise my work*](../eines-optimitzar-feina/) (8 hours) complement the course for those who want to go deeper into some of its topics.

    ## For companies

    This course is offered on demand, in-house for companies, and can be adapted to their needs. For more information, write to [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
ca:
  title: Curs Intensiu de Direcció de Projectes
  summary: Una introducció de 36 hores a la direcció de projectes segons la Guia del PMBOK® del Project Management Institute (PMI), des de l'abast, les tasques i el cronograma fins a l'equip, el pressupost, els riscs i la qualitat, a partir d'un cas pràctic. Proporciona les més de 35 hores de formació en gestió de projectes que requereix la certificació PMP®. Per a professionals amb experiència en direcció de projectes o sense, i adaptable a empreses.
  body: |
    ## Presentació

    Un curs intensiu sobre els fonaments de la direcció de projectes, segons la Guia del PMBOK® del Project Management Institute (PMI). Els participants aprenen les eines i les tècniques per gestionar els recursos, els terminis i els costs d'un projecte de manera més eficient. Amb les seves 36 hores, el curs també acredita les més de 35 hores de formació en gestió de projectes que es requereixen per optar a la certificació professional PMP®.

    ## A qui s'adreça

    A qualsevol professional que vulgui ser director de projectes o que tengui responsabilitats de gestió. És útil tant per a qui no té experiència en direcció de projectes com per a qui ja hi treballa.

    ## Pla d'estudis

    1. Definir l'abast del projecte
    2. Organitzar el projecte en tasques
    3. Distribuir les activitats en el temps
    4. Determinar l'equip
    5. Calcular el pressupost
    6. Avaluar els riscs del projecte
    7. Vigilar la qualitat dels resultats

    ## Metodologia

    Els conceptes es presenten a partir d'un cas pràctic. Els seminaris *L'art de negociar* (4 hores) i [*Eines per a optimitzar la meva feina*](../eines-optimitzar-feina/) (8 hores) complementen el curs per a qui en vulgui aprofundir alguns temes.

    ## Per a empreses

    Aquest curs s'ofereix a demanda, a la mateixa empresa, i es pot adaptar a les seves necessitats. Per a més informació, escriviu a [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
es:
  title: Curso Intensivo de Dirección de Proyectos
  summary: Una introducción de 36 horas a la dirección de proyectos según la Guía del PMBOK® del Project Management Institute (PMI), desde el alcance, las tareas y el cronograma hasta el equipo, el presupuesto, los riesgos y la calidad, a partir de un caso práctico. Proporciona las más de 35 horas de formación en gestión de proyectos que requiere la certificación PMP®. Para profesionales con o sin experiencia en dirección de proyectos, y adaptable a empresas.
  body: |
    ## Presentación

    Un curso intensivo sobre los fundamentos de la dirección de proyectos, según la Guía del PMBOK® del Project Management Institute (PMI). Los participantes aprenden las herramientas y las técnicas para gestionar los recursos, los plazos y los costes de un proyecto de forma más eficiente. Con sus 36 horas, el curso también acredita las más de 35 horas de formación en gestión de proyectos que se requieren para optar a la certificación profesional PMP®.

    ## A quién se dirige

    A cualquier profesional que quiera ser director de proyectos o que tenga responsabilidades de gestión. Es útil tanto para quien no tiene experiencia en dirección de proyectos como para quien ya trabaja en ello.

    ## Plan de estudios

    1. Definir el alcance del proyecto
    2. Organizar el proyecto en tareas
    3. Distribuir las actividades en el tiempo
    4. Determinar el equipo
    5. Calcular el presupuesto
    6. Evaluar los riesgos del proyecto
    7. Vigilar la calidad de los resultados

    ## Metodología

    Los conceptos se presentan a partir de un caso práctico. Los seminarios *El arte de negociar* (4 horas) y [*Herramientas para optimizar mi trabajo*](../eines-optimitzar-feina/) (8 horas) complementan el curso para quien quiera profundizar en algunos temas.

    ## Para empresas

    Este curso se ofrece bajo demanda, en la propia empresa, y se puede adaptar a sus necesidades. Para más información, escribe a [projectmanagement@uib.es](mailto:projectmanagement@uib.es).
