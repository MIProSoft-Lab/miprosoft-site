en:
  title: University Microcredential in Artificial Intelligence Tools for Project Management
  order: 1
  type: microcredential
  summary: How to use generative AI tools effectively, creatively and responsibly when managing projects, knowing what they can and cannot do. It covers AI tools for project management, writing the planning, monitoring and closing documents with AI, organisation and creativity, prompts for a project manager's assistant, and good practices in the workplace. For professionals from any sector; no previous training is needed.
  instructors:
    - antoni-mesquida
    - maria-monserrat
    - antonio-crespi
    - jose-cañellas
    - toni-bennasar
  start: 2025-11
  end: 2025-11
  format: in-person
  ects: 1
  hours: 10
  institution: Universitat de les Illes Balears
  url: https://fueib.org/ca/microcredencials/811/formacion/curso/1712/microcredencial-universitaria-deines-dintelligencia-artificial-per-a-la-direccio-de-projectes-1-ects
ca:
  title: Microcredencial Universitària d'Eines d'Intel·ligència Artificial per a la Direcció de Projectes
  summary: Com fer servir eines d'IA generativa de manera eficaç, creativa i responsable en la direcció de projectes, coneixent-ne les possibilitats i els límits. Tracta les eines d'IA per dirigir projectes, la redacció amb IA dels documents de planificació, seguiment i tancament, l'organització i la creativitat, els prompts per a un assistent del cap de projecte i les bones pràctiques al lloc de feina. Per a professionals de qualsevol sector; no cal formació prèvia.
es:
  title: Microcredencial Universitaria de Herramientas de Inteligencia Artificial para la Dirección de Proyectos
  summary: Cómo usar herramientas de IA generativa de forma eficaz, creativa y responsable en la dirección de proyectos, conociendo sus posibilidades y sus límites. Trata las herramientas de IA para dirigir proyectos, la redacción con IA de los documentos de planificación, seguimiento y cierre, la organización y la creatividad, los prompts para un asistente del jefe de proyecto y las buenas prácticas en el puesto de trabajo. Para profesionales de cualquier sector; no se necesita formación previa.
