en:
  title: University Specialist in Project Management
  type: postgraduate
  summary: A UIB postgraduate degree of 30 ECTS, now in its 15th edition, that prepares professionals to plan, execute, monitor and close projects following the PMBOK® Guide, and for the PMP® certification exam of the Project Management Institute (PMI®).
  instructors:
    - antonia-mas
    - antoni-mesquida
  start: 2026-10
  end: 2027-04
  schedule: Wednesdays and Fridays, 18:00–21:00, and one Saturday a month, 9:30–13:30
  format: hybrid
  ects: 30
  hours: 147
  institution: Universitat de les Illes Balears
  url: https://projectmanagement.uib.cat/titols-propis-de-la-uib/especialista-uib-direccio-projectes-project-management-30-ects/
  body: |
    ## Overview

    The University Specialist in Project Management is a postgraduate degree of the Universitat de les Illes Balears (*títol propi*) of 30 ECTS credits, with content adapted from the latest PMBOK® Guide. It is an eminently practical course: students learn to identify the phases and areas of a project, and to plan, execute, monitor and close it, managing its schedule, costs, team, communications and risks. It also prepares them to lead multidisciplinary, distributed and multicultural teams, to make decisions under pressure, to negotiate, and to align project management with the company's strategy.

    ## Who it is for

    Any professional who wants to steer their career towards project management, such as project managers and directors, PMO directors, programme and portfolio directors, quality managers, project consultants and auditors, and general managers.

    - Students with an official university degree obtain the **University Specialist in Project Management** (UIB's own degree, 30 ECTS).
    - Students without one obtain the **Certificate of Continuing Education in Project Management** (30 ECTS).

    ## Programme

    1. Project management: basic concepts
    2. Project stakeholder management
    3. Project integration management
    4. Project scope management
    5. Project schedule management
    6. Project human resource management
    7. Project communications management
    8. Project cost management
    9. Project procurement management
    10. Project risk management
    11. Project quality management
    12. Project monitoring and closing
    13. Project management tools
    14. Seminars and workshops
    15. Monitoring of the individual project
    16. The PMP® certification of the PMI®

    Throughout the course, each student works on a project of their own, real or hypothetical, applying what they learn in each module (*learning by doing*), and presents its progress in monitoring sessions.

    ## Methodology and assessment

    The course is blended: more than 45 in-person sessions, at the UIB campus on Wednesdays and Fridays and at the Sa Riera building (Palma) one Saturday a month, with the materials available at all times in the UIB's digital classroom. To pass, students must attend at least 85% of the teaching hours. The final grade takes into account the work set in each module, the presentation and defence of the individual project before a panel, and participation.

    ## PMP® certification

    The course covers the knowledge in the PMP® certification exam of the Project Management Institute (PMI®), and provides more than the 35 hours of project management training required to take it.

    ## Teaching staff

    Directed by **Antònia Mas Pichaco** (full professor, UIB) and coordinated by **Antoni Mesquida Calafat** (associate professor, UIB), with professionals from companies and institutions:

    - José Bautista Barato Arroyo, Director, PMPeople
    - Joan Barceló Perelló, Corporate CIO, World 2 Meet (Grupo Iberostar)
    - Bartomeu Cabot Pärnänen, Service Manager, Meliá Hotels International
    - Antonio Díaz Díaz, Managing Director, The Last Mile
    - Bartomeu Fluxà Cabrer, PMO Senior Consultant and PM Practice Leader, CGI
    - José María Gilabert Flor, Information Technology Centre, UIB
    - Josep Antoni Grimalt Morey, GNGRUP
    - Jaime Izquierdo Pereira, Managing Partner, West Lemorann SL
    - Laura Justo Hermida, LJSelection
    - Bartolomé Mayol Genovart, Tomeu Vidal Abogados
    - José Pareja Krauel, GYG plc
    - Noelia Pico Gayo, SM2 by PLEXUS
    - Pau Servera Salas, Partner, Teocé Consultors
    - Gema Torrens Espinosa, psychologist, trainer and associate lecturer, UIB

    ## Fees and enrolment

    The fee for the 2026–27 edition is €2,800, which can be paid in two instalments (€1,800 on enrolment and the rest in December). The course may be fully or partly subsidised by the Spanish State Foundation for Training in Employment (FUNDAE). Enrolment is through [UIBTalent](https://fueib.org/ca/uibtalent/238/formacion/curso/1843/especialista-universitari-en-direccio-de-projectes-project-management-titol-propi-de-la-uib-30-ects-); see the official website for the dates and conditions of each edition.
ca:
  title: Especialista Universitari en Direcció de Projectes (Project Management)
  summary: Un títol propi de postgrau de la UIB de 30 ECTS, ja en la 15a edició, que prepara els professionals per planificar, executar, fer el seguiment i tancar projectes segons la Guia del PMBOK®, i per a l'examen de la certificació PMP® del Project Management Institute (PMI®).
  schedule: Dimecres i divendres, de 18 a 21 h, i un dissabte al mes, de 9.30 a 13.30 h
  body: |
    ## Presentació

    El Curs d'Especialista Universitari en Direcció de Projectes (Project Management) és un títol propi de postgrau de la Universitat de les Illes Balears, de 30 crèdits europeus (ECTS), amb continguts adaptats de la darrera Guia del PMBOK®. És un curs eminentment pràctic: l'alumnat aprèn a identificar les fases i les àrees d'un projecte, i a planificar-lo, executar-lo, fer-ne el seguiment i tancar-lo, gestionant-ne el cronograma, els costs, l'equip, les comunicacions i els riscs. També el capacita per liderar equips de treball multidisciplinaris, distribuïts i multiculturals, prendre decisions sota pressió, negociar i alinear la gestió dels projectes amb l'estratègia de l'empresa.

    ## A qui s'adreça

    A qualsevol professional que vulgui orientar la seva carrera professional envers la gestió de projectes, com ara caps i directors de projectes, directors d'oficines de gestió de projectes, directors de programes i de carteres de projectes, responsables de qualitat, consultors i auditors de projectes, i gerents.

    - L'alumnat amb titulació universitària reglada obté l'**Especialista Universitari en Direcció de Projectes** (títol propi de la UIB, 30 ECTS).
    - L'alumnat sense titulació universitària reglada obté el **Certificat de Formació Permanent en Direcció de Projectes** (30 ECTS).

    ## Pla d'estudis

    1. La gestió de projectes. Conceptes bàsics
    2. La gestió dels interessats del projecte
    3. La gestió de la integració del projecte
    4. La gestió de l'abast del projecte
    5. La gestió del cronograma del projecte
    6. La gestió dels recursos humans del projecte
    7. La gestió de les comunicacions del projecte
    8. La gestió dels costs del projecte
    9. La gestió de les adquisicions del projecte
    10. La gestió dels riscs del projecte
    11. La gestió de la qualitat del projecte
    12. El seguiment i el tancament del projecte
    13. Eines de gestió de projectes
    14. Seminaris i tallers
    15. Seguiment del projecte individual
    16. La certificació PMP® del PMI®

    Durant tot el curs, cada alumne treballa en un projecte propi, real o hipotètic, en què aplica el que aprèn a cada mòdul (*learning by doing*), i en presenta els avenços a les sessions de seguiment.

    ## Metodologia i avaluació

    El curs és semipresencial: més de 45 sessions presencials, al campus de la UIB els dimecres i els divendres i a l'edifici Sa Riera (Palma) un dissabte al mes, amb els materials disponibles en tot moment a l'Aula Digital de la UIB. Per superar-lo cal assistir, com a mínim, al 85 % de les hores lectives. La nota final té en compte els treballs de cada mòdul, la presentació i la defensa del projecte individual davant un tribunal, i la participació.

    ## Certificació PMP®

    El curs ofereix els coneixements inclosos en l'examen de la certificació PMP® del Project Management Institute (PMI®), i més de les 35 hores de formació en gestió de projectes que cal haver rebut per presentar-s'hi.

    ## Equip docent

    Dirigit per **Antònia Mas Pichaco** (catedràtica d'universitat, UIB) i coordinat per **Antoni Mesquida Calafat** (professor titular d'universitat, UIB), amb professionals d'empreses i institucions:

    - José Bautista Barato Arroyo, director, PMPeople
    - Joan Barceló Perelló, Corporate CIO, World 2 Meet (Grupo Iberostar)
    - Bartomeu Cabot Pärnänen, Service Manager, Meliá Hotels International
    - Antonio Díaz Díaz, Managing Director, The Last Mile
    - Bartomeu Fluxà Cabrer, PMO Senior Consultant i PM Practice Leader, CGI
    - José María Gilabert Flor, Centre de Tecnologies de la Informació, UIB
    - Josep Antoni Grimalt Morey, GNGRUP
    - Jaime Izquierdo Pereira, soci gerent, West Lemorann SL
    - Laura Justo Hermida, LJSelection
    - Bartolomé Mayol Genovart, Tomeu Vidal Abogados
    - José Pareja Krauel, GYG plc
    - Noelia Pico Gayo, SM2 by PLEXUS
    - Pau Servera Salas, soci, Teocé Consultors
    - Gema Torrens Espinosa, psicòloga, formadora i professora associada, UIB

    ## Preu i matrícula

    El preu de matrícula de l'edició 2026-27 és de 2.800 €, que es pot fraccionar en dos terminis (1.800 € en formalitzar la matrícula i la resta el mes de desembre). El curs pot ser bonificable totalment o parcialment per la Fundació Estatal per a la Formació en l'Ocupació (FUNDAE). La matrícula es fa a través d'[UIBTalent](https://fueib.org/ca/uibtalent/238/formacion/curso/1843/especialista-universitari-en-direccio-de-projectes-project-management-titol-propi-de-la-uib-30-ects-); consultau el web oficial per a les dates i les condicions de cada edició.
es:
  title: Especialista Universitario en Dirección de Proyectos (Project Management)
  summary: Un título propio de posgrado de la UIB de 30 ECTS, ya en su 15.ª edición, que prepara a los profesionales para planificar, ejecutar, hacer el seguimiento y cerrar proyectos según la Guía del PMBOK®, y para el examen de la certificación PMP® del Project Management Institute (PMI®).
  schedule: Miércoles y viernes, de 18 a 21 h, y un sábado al mes, de 9:30 a 13:30 h
  body: |
    ## Presentación

    El Curso de Especialista Universitario en Dirección de Proyectos (Project Management) es un título propio de posgrado de la Universitat de les Illes Balears, de 30 créditos europeos (ECTS), con contenidos adaptados de la última Guía del PMBOK®. Es un curso eminentemente práctico: el alumnado aprende a identificar las fases y las áreas de un proyecto, y a planificarlo, ejecutarlo, hacer su seguimiento y cerrarlo, gestionando su cronograma, sus costes, el equipo, las comunicaciones y los riesgos. También lo capacita para liderar equipos de trabajo multidisciplinares, distribuidos y multiculturales, tomar decisiones bajo presión, negociar y alinear la gestión de los proyectos con la estrategia de la empresa.

    ## A quién se dirige

    A cualquier profesional que quiera orientar su carrera profesional hacia la gestión de proyectos, como jefes y directores de proyectos, directores de oficinas de gestión de proyectos, directores de programas y de carteras de proyectos, responsables de calidad, consultores y auditores de proyectos, y gerentes.

    - El alumnado con titulación universitaria reglada obtiene el **Especialista Universitario en Dirección de Proyectos** (título propio de la UIB, 30 ECTS).
    - El alumnado sin titulación universitaria reglada obtiene el **Certificado de Formación Permanente en Dirección de Proyectos** (30 ECTS).

    ## Plan de estudios

    1. La gestión de proyectos. Conceptos básicos
    2. La gestión de los interesados del proyecto
    3. La gestión de la integración del proyecto
    4. La gestión del alcance del proyecto
    5. La gestión del cronograma del proyecto
    6. La gestión de los recursos humanos del proyecto
    7. La gestión de las comunicaciones del proyecto
    8. La gestión de los costes del proyecto
    9. La gestión de las adquisiciones del proyecto
    10. La gestión de los riesgos del proyecto
    11. La gestión de la calidad del proyecto
    12. El seguimiento y el cierre del proyecto
    13. Herramientas de gestión de proyectos
    14. Seminarios y talleres
    15. Seguimiento del proyecto individual
    16. La certificación PMP® del PMI®

    Durante todo el curso, cada alumno trabaja en un proyecto propio, real o hipotético, en el que aplica lo que aprende en cada módulo (*learning by doing*), y presenta sus avances en las sesiones de seguimiento.

    ## Metodología y evaluación

    El curso es semipresencial: más de 45 sesiones presenciales, en el campus de la UIB los miércoles y los viernes y en el edificio Sa Riera (Palma) un sábado al mes, con los materiales disponibles en todo momento en el Aula Digital de la UIB. Para superarlo hay que asistir, como mínimo, al 85 % de las horas lectivas. La nota final tiene en cuenta los trabajos de cada módulo, la presentación y la defensa del proyecto individual ante un tribunal, y la participación.

    ## Certificación PMP®

    El curso ofrece los conocimientos incluidos en el examen de la certificación PMP® del Project Management Institute (PMI®), y más de las 35 horas de formación en gestión de proyectos necesarias para presentarse a él.

    ## Equipo docente

    Dirigido por **Antònia Mas Pichaco** (catedrática de universidad, UIB) y coordinado por **Antoni Mesquida Calafat** (profesor titular de universidad, UIB), con profesionales de empresas e instituciones:

    - José Bautista Barato Arroyo, director, PMPeople
    - Joan Barceló Perelló, Corporate CIO, World 2 Meet (Grupo Iberostar)
    - Bartomeu Cabot Pärnänen, Service Manager, Meliá Hotels International
    - Antonio Díaz Díaz, Managing Director, The Last Mile
    - Bartomeu Fluxà Cabrer, PMO Senior Consultant y PM Practice Leader, CGI
    - José María Gilabert Flor, Centro de Tecnologías de la Información, UIB
    - Josep Antoni Grimalt Morey, GNGRUP
    - Jaime Izquierdo Pereira, socio gerente, West Lemorann SL
    - Laura Justo Hermida, LJSelection
    - Bartolomé Mayol Genovart, Tomeu Vidal Abogados
    - José Pareja Krauel, GYG plc
    - Noelia Pico Gayo, SM2 by PLEXUS
    - Pau Servera Salas, socio, Teocé Consultors
    - Gema Torrens Espinosa, psicóloga, formadora y profesora asociada, UIB

    ## Precio y matrícula

    El precio de matrícula de la edición 2026-27 es de 2.800 €, que se puede fraccionar en dos plazos (1.800 € al formalizar la matrícula y el resto en el mes de diciembre). El curso puede ser bonificable total o parcialmente por la Fundación Estatal para la Formación en el Empleo (FUNDAE). La matrícula se hace a través de [UIBTalent](https://fueib.org/es/uibtalent/238/formacion/curso/1843/especialista-universitari-en-direccio-de-projectes-project-management-titol-propi-de-la-uib-30-ects-); consulta la web oficial para las fechas y las condiciones de cada edición.
