# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# GENERATED by scripts/cms-config.mjs from site.config.yaml, the members and
# content/translations/: edit those (or the script) instead of this file.
app_title: MIProSoft · Content editor
logo:
  src: /admin/logo.png
backend:
  name: github
  repo: MIProSoft-Lab/miprosoft-site
  branch: main
  auth_methods:
    - token
media_folder: /public/media
public_folder: /media
i18n:
  structure: single_file
  locales:
    - en
    - ca
    - es
  default_locale: en
  initial_locales: all
collections:
  - name: news
    label: News & blog
    label_singular: Post
    description: News and blog posts. The latest three are shown on the home page.
    folder: content/news
    path: "{{slug}}/index"
    extension: yaml
    format: yaml
    media_folder: ""
    public_folder: ""
    create: true
    i18n: true
    summary: "{{date}} · {{title}}"
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: date
        label: Date
        widget: datetime
        type: date
      - name: kind
        label: Type
        widget: select
        default: news
        options:
          - label: News
            value: news
          - label: Blog post
            value: blog
      - name: authors
        label: Authors
        widget: select
        multiple: true
        required: false
        options: &a1
          - label: Antonio Crespi Tobeña
            value: antonio-crespi
          - label: Maria Monserrat Barceló
            value: maria-monserrat
          - label: Antoni Lluís Mesquida Calafat
            value: antoni-mesquida
          - label: Pérez-Cañellas, J.D.
            value: jose-cañellas
          - label: Antoni Bennasar Garau
            value: toni-bennasar
          - label: Antonia Mas
            value: antonia-mas
        hint: Group members; they link to their profiles.
      - name: guestAuthors
        label: Other authors
        widget: list
        required: false
        hint: People who are not members of the group.
        field:
          name: name
          label: Name
          widget: string
      - name: image
        label: Cover image
        widget: image
        required: false
      - name: imageAlt
        label: Cover image description
        widget: string
        i18n: true
        required: false
        hint: What the picture shows, for people who cannot see it.
      - name: summary
        label: Summary
        widget: text
        i18n: true
        required: false
        hint: One or two sentences for the cards. If empty, the start of the text is used.
      - name: body
        label: Text
        widget: markdown
        i18n: true
        hint: An image followed by a line in italics shows the italics as its caption.
  - name: courses
    label: Courses
    label_singular: Course
    description: Courses the group currently teaches. Delete a course when it is no longer offered.
    folder: content/courses
    extension: yaml
    format: yaml
    create: true
    i18n: true
    summary: "{{title}}"
    sortable_fields:
      - order
      - title
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Courses are listed by this number, lowest first.
      - name: type
        label: Type
        widget: select
        required: false
        options:
          - label: Master's
            value: master
          - label: Postgraduate
            value: postgraduate
          - label: Short course
            value: short
          - label: Workshop
            value: workshop
          - label: Online course
            value: online
          - label: Course
            value: other
      - name: summary
        label: Description
        widget: text
        i18n: true
        required: false
      - name: instructors
        label: Instructors
        widget: select
        multiple: true
        required: false
        options: *a1
        hint: Group members; they link to their profiles.
      - name: guestInstructors
        label: Other instructors
        widget: list
        required: false
        hint: People who are not members of the group.
        field:
          name: name
          label: Name
          widget: string
      - name: start
        label: Start
        widget: string
        required: false
        pattern:
          - ^\d{4}(-\d{2})?$
          - A year or year-month, e.g. 2027 or 2027-02
      - name: end
        label: End
        widget: string
        required: false
        pattern:
          - ^\d{4}(-\d{2})?$
          - A year or year-month, e.g. 2027 or 2027-06
      - name: schedule
        label: Schedule
        widget: string
        i18n: true
        required: false
        hint: Free text, e.g. "Tuesdays and Thursdays, 16:00–18:00".
      - name: format
        label: Format
        widget: select
        required: false
        options:
          - label: In person
            value: in-person
          - label: Online
            value: online
          - label: Hybrid
            value: hybrid
      - name: languages
        label: Taught in
        widget: select
        multiple: true
        required: false
        options:
          - label: English
            value: en
          - label: Catalan
            value: ca
          - label: Spanish
            value: es
      - name: ects
        label: ECTS credits
        widget: number
        value_type: float
        required: false
      - name: hours
        label: Hours
        widget: number
        value_type: int
        required: false
        hint: Shown when there are no ECTS credits.
      - name: institution
        label: Institution
        widget: string
        i18n: true
        required: false
      - name: url
        label: Link
        widget: string
        required: false
        hint: Information or enrolment page.
