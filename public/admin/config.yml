# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# GENERATED by scripts/cms-config.mjs from site.config.yaml, the members and
# content/translations/: edit those (or the script) instead of this file.
app_title: MIProSoft · Content editor
logo:
  src: /admin/logo.png
backend:
  name: github
  repo: MIProSoft-Lab/miprosoft-site
  branch: main
  auth_methods:
    - token
media_folder: /public/media
public_folder: /media
i18n:
  structure: single_file
  locales:
    - en
    - ca
    - es
  default_locale: en
  initial_locales: all
collections:
  - name: news
    label: News & blog
    label_singular: Post
    description: News and blog posts. The latest three are shown on the home page.
    folder: content/news
    path: "{{slug}}/index"
    extension: yaml
    format: yaml
    media_folder: ""
    public_folder: ""
    create: true
    i18n: true
    summary: "{{date}} · {{title}}"
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: date
        label: Date
        widget: datetime
        type: date
      - name: kind
        label: Type
        widget: select
        default: news
        options:
          - label: News
            value: news
          - label: Blog post
            value: blog
      - name: authors
        label: Authors
        widget: select
        multiple: true
        required: false
        options: &a1
          - label: Antonio Crespi Tobeña
            value: antonio-crespi
          - label: Maria Monserrat Barceló
            value: maria-monserrat
          - label: Antoni Lluís Mesquida Calafat
            value: antoni-mesquida
          - label: Jose David Pérez Cañellas
            value: jose-cañellas
          - label: Antoni Bennasar Garau
            value: toni-bennasar
          - label: Antonia Mas
            value: antonia-mas
        hint: Group members; they link to their profiles.
      - name: guestAuthors
        label: Other authors
        widget: list
        required: false
        hint: People who are not members of the group.
        field:
          name: name
          label: Name
          widget: string
      - name: image
        label: Cover image
        widget: image
        required: false
      - name: imageAlt
        label: Cover image description
        widget: string
        i18n: true
        required: false
        hint: What the picture shows, for people who cannot see it.
      - name: summary
        label: Summary
        widget: text
        i18n: true
        required: false
        hint: One or two sentences for the cards. If empty, the start of the text is used.
      - name: body
        label: Text
        widget: markdown
        i18n: true
        hint: An image followed by a line in italics shows the italics as its caption. A code block with the language “cite” holding a DOI of one of the group’s publications (e.g. doi:10.1002/cae.21990), or a BibTeX entry, shows a box to cite it in IEEE, APA, Chicago, BibTeX and RIS.
      - name: publications
        label: Related publications
        widget: select
        multiple: true
        required: false
        hint: The group’s publications the post is about. They are listed at the end of the post, and each one links back to it in the publication lists.
