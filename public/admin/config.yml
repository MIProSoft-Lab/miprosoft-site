# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# GENERATED by scripts/cms-config.mjs from site.config.yaml, the members and
# content/translations/: edit those (or the script) instead of this file.
app_title: MIProSoft · Content editor
logo:
  src: /admin/logo.png
backend:
  name: github
  repo: MIProSoft-Lab/miprosoft-site
  branch: main
  auth_methods:
    - token
media_folder: /public/media
public_folder: /media
i18n:
  structure: single_file
  locales:
    - en
    - ca
    - es
  default_locale: en
  initial_locales: all
collections:
  - name: news
    label: News & blog
    label_singular: Post
    description: News and blog posts. The latest three are shown on the home page.
    folder: content/news
    path: "{{slug}}/index"
    extension: yaml
    format: yaml
    media_folder: ""
    public_folder: ""
    create: true
    i18n: true
    summary: "{{date}} · {{title}}"
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: date
        label: Date
        widget: datetime
        type: date
      - name: kind
        label: Type
        widget: select
        default: news
        options:
          - label: News
            value: news
          - label: Blog post
            value: blog
      - name: authors
        label: Authors
        widget: select
        multiple: true
        required: false
        options: &a1
          - label: Antonio Crespi Tobeña
            value: antonio-crespi
          - label: Maria Monserrat Barceló
            value: maria-monserrat
          - label: Antoni Lluís Mesquida Calafat
            value: antoni-mesquida
          - label: Jose David Pérez Cañellas
            value: jose-cañellas
          - label: Antoni Bennasar Garau
            value: toni-bennasar
          - label: Antonia Mas
            value: antonia-mas
        hint: Group members; they link to their profiles.
      - name: guestAuthors
        label: Other authors
        widget: list
        required: false
        hint: People who are not members of the group.
        field:
          name: name
          label: Name
          widget: string
      - name: image
        label: Cover image
        widget: image
        required: false
      - name: imageAlt
        label: Cover image description
        widget: string
        i18n: true
        required: false
        hint: What the picture shows, for people who cannot see it.
      - name: summary
        label: Summary
        widget: text
        i18n: true
        required: false
        hint: One or two sentences for the cards. If empty, the start of the text is used.
      - name: body
        label: Text
        widget: markdown
        i18n: true
        hint: An image followed by a line in italics shows the italics as its caption.
  - name: research-lines
    label: Research lines
    label_singular: Research line
    description: The research lines shown on the Research page.
    folder: content/research-lines
    extension: yaml
    format: yaml
    create: true
    i18n: true
    summary: "{{title}}"
    sortable_fields:
      - order
      - title
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Research lines are listed by this number, lowest first.
      - name: summary
        label: Summary
        widget: text
        i18n: true
        required: false
        hint: One or two sentences, shown under the title.
      - name: description
        label: Description
        widget: markdown
        i18n: true
        required: false
        hint: Topics, projects, results… Optional.
      - name: members
        label: Researchers
        widget: select
        multiple: true
        required: false
        options: *a1
        hint: Group members working on this line; they link to their profiles.
  - name: theses
    label: Theses
    label_singular: Thesis
    description: PhD theses, master’s theses (TFM) and bachelor’s theses (TFG) supervised by members. They are listed on the Research page and on the supervisors’ profiles.
    folder: content/theses
    extension: yaml
    format: yaml
    create: true
    i18n: true
    summary: "{{year}} · {{student}} · {{title}}"
    sortable_fields:
      - year
      - title
      - student
    fields:
      - name: title
        label: Title
        widget: string
        hint: In the language the thesis is written in.
      - name: student
        label: Student
        widget: string
      - name: type
        label: Type
        widget: select
        default: phd
        options:
          - label: PhD thesis
            value: phd
          - label: Master's thesis
            value: master
          - label: Bachelor's thesis
            value: bachelor
      - name: status
        label: Status
        widget: select
        default: defended
        options:
          - label: Defended
            value: defended
          - label: In progress
            value: ongoing
      - name: year
        label: Year
        widget: number
        value_type: int
        required: false
        hint: Year of the defence (or of the start, if in progress).
      - name: supervisors
        label: Supervisors
        widget: select
        multiple: true
        required: false
        options: *a1
        hint: Group members; they link to their profiles, and the thesis is listed on them.
      - name: guestSupervisors
        label: Other supervisors
        widget: list
        required: false
        hint: People who are not members of the group.
        field:
          name: name
          label: Name
          widget: string
      - name: degree
        label: Degree or programme
        widget: string
        i18n: true
        required: false
        hint: E.g. "Doctoral Programme in Information and Communication Technologies".
      - name: institution
        label: University
        widget: string
        i18n: true
        required: false
      - name: url
        label: Link
        widget: string
        required: false
        hint: The thesis in a repository, e.g. UIB’s or TDX.
  - name: courses
    label: Courses
    label_singular: Course
    description: Courses the group currently teaches. Delete a course when it is no longer offered.
    folder: content/courses
    extension: yaml
    format: yaml
    create: true
    i18n: true
    summary: "{{title}}"
    sortable_fields:
      - order
      - title
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Courses are listed by this number, lowest first.
      - name: type
        label: Type
        widget: select
        required: false
        options:
          - label: Master's
            value: master
          - label: Postgraduate
            value: postgraduate
          - label: Short course
            value: short
          - label: Workshop
            value: workshop
          - label: Online course
            value: online
          - label: Course
            value: other
      - name: summary
        label: Description
        widget: text
        i18n: true
        required: false
      - name: instructors
        label: Instructors
        widget: select
        multiple: true
        required: false
        options: *a1
        hint: Group members; they link to their profiles.
      - name: guestInstructors
        label: Other instructors
        widget: list
        required: false
        hint: People who are not members of the group.
        field:
          name: name
          label: Name
          widget: string
      - name: start
        label: Start
        widget: string
        required: false
        pattern:
          - ^\d{4}(-\d{2})?$
          - A year or year-month, e.g. 2027 or 2027-02
      - name: end
        label: End
        widget: string
        required: false
        pattern:
          - ^\d{4}(-\d{2})?$
          - A year or year-month, e.g. 2027 or 2027-06
      - name: schedule
        label: Schedule
        widget: string
        i18n: true
        required: false
        hint: Free text, e.g. "Tuesdays and Thursdays, 16:00–18:00".
      - name: format
        label: Format
        widget: select
        required: false
        options:
          - label: In person
            value: in-person
          - label: Online
            value: online
          - label: Hybrid
            value: hybrid
      - name: languages
        label: Taught in
        widget: select
        multiple: true
        required: false
        options:
          - label: English
            value: en
          - label: Catalan
            value: ca
          - label: Spanish
            value: es
      - name: ects
        label: ECTS credits
        widget: number
        value_type: float
        required: false
      - name: hours
        label: Hours
        widget: number
        value_type: int
        required: false
        hint: Shown when there are no ECTS credits.
      - name: institution
        label: Institution
        widget: string
        i18n: true
        required: false
      - name: url
        label: Link
        widget: string
        required: false
        hint: Information or enrolment page.
  - name: tools
    label: Tools
    label_singular: Tool
    description: Tools the group has developed. Each one is listed, as a card with its summary, on the Tools page of Research, of Teaching, or of both, as its sections say, and has a page of its own with the full text.
    folder: content/tools
    extension: yaml
    format: yaml
    create: true
    i18n: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    summary: "{{title}}"
    sortable_fields:
      - order
      - title
    fields:
      - name: title
        label: Name
        widget: string
        i18n: true
      - name: tags
        label: Sections
        widget: select
        multiple: true
        min: 1
        default:
          - research
        hint: "Where the tool is listed: under Research, under Teaching, or both."
        options:
          - label: Research
            value: research
          - label: Teaching
            value: teaching
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Tools are listed by this number, lowest first.
      - name: audiences
        label: For
        widget: select
        multiple: true
        required: false
        hint: Who the tool is for.
        options:
          - label: Companies
            value: companies
          - label: Society
            value: society
          - label: Education
            value: education
          - label: Public administration
            value: administration
      - name: summary
        label: Summary
        widget: text
        i18n: true
        required: false
        hint: One or two sentences, shown on the card and at the top of the tool’s page.
      - name: image
        label: Logo
        widget: image
        required: false
        hint: Shown small, next to the name. Square works best.
      - name: body
        label: Page text
        widget: markdown
        i18n: true
        required: false
        hint: "The tool’s own page: what it does, pictures, guides, results… An image followed by a line in italics shows the italics as its caption."
      - name: links
        label: Links
        widget: list
        i18n: true
        required: false
        label_singular: Link
        hint: Shown on the tool’s page, and the first one also on its card. The first one is shown as a button, e.g. the tool itself; then a demo, the code, a paper… Each language has its own list, so the texts can be translated; if a language has none, the default language’s are shown.
        summary: "{{label}} · {{url}}"
        fields:
          - name: label
            label: Text
            widget: string
            required: false
            hint: E.g. "Try it". If empty, the site name is shown.
          - name: url
            label: URL
            widget: string
            pattern:
              - ^(https?://|mailto:)
              - A full address starting with https:// (or mailto:)
  - name: collaborators
    label: Collaborators
    label_singular: Collaborator
    description: People outside the group who work with it, shown on the team page after the members. Group members are set in site.config.yaml.
    folder: content/collaborators
    extension: yaml
    format: yaml
    create: true
    i18n: true
    slug: "{{name}}"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields:
      - order
      - name
    fields:
      - name: name
        label: Name
        widget: string
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Collaborators are listed by this number, lowest first, then by name.
      - name: role
        label: Position
        widget: string
        i18n: true
        required: false
        hint: E.g. "Associate professor".
      - name: institution
        label: Institution
        widget: string
        i18n: true
        required: false
      - name: photo
        label: Photo
        widget: image
        required: false
        hint: Square works best. Without a photo, their initials are shown.
      - name: links
        label: Links
        widget: list
        required: false
        label_singular: Link
        hint: Shown on their card, e.g. ORCID, Google Scholar, their own web page.
        summary: "{{label}} · {{url}}"
        fields:
          - name: label
            label: Text
            widget: string
            required: false
            hint: E.g. "ORCID". If empty, the site name is shown.
          - name: url
            label: URL
            widget: string
            pattern:
              - ^(https?://|mailto:)
              - A full address starting with https:// (or mailto:)
