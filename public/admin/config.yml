  - name: research-lines
    label: Research lines
    label_singular: Research line
    description: The research lines shown on the Research page.
    folder: content/research-lines
    extension: yaml
    format: yaml
    create: true
    i18n: true
    summary: "{{title}}"
    sortable_fields:
      - order
      - title
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Research lines are listed by this number, lowest first.
      - name: summary
        label: Summary
        widget: text
        i18n: true
        required: false
        hint: One or two sentences, shown under the title.
      - name: description
        label: Description
        widget: markdown
        i18n: true
        required: false
        hint: Topics, projects, results… Optional. A code block with the language “cite” holding a DOI of one of the group’s publications (e.g. doi:10.1002/cae.21990), or a BibTeX entry, shows a box to cite it in IEEE, APA, Chicago, BibTeX and RIS.
      - name: members
        label: Researchers
        widget: select
        multiple: true
        required: false
        options: *a1
        hint: Group members working on this line; they link to their profiles.
  - name: theses
    label: Theses
    label_singular: Thesis
    description: PhD theses, master’s theses (TFM) and bachelor’s theses (TFG) supervised by members. They are listed on the Research page and on the supervisors’ profiles.
    folder: content/theses
    extension: yaml
    format: yaml
    create: true
    i18n: true
    summary: "{{year}} · {{student}} · {{title}}"
    sortable_fields:
      - year
      - title
      - student
    fields:
      - name: title
        label: Title
        widget: string
        hint: In the language the thesis is written in.
      - name: student
        label: Student
        widget: string
      - name: type
        label: Type
        widget: select
        default: phd
        options:
          - label: PhD thesis
            value: phd
          - label: Master's thesis
            value: master
          - label: Bachelor's thesis
            value: bachelor
      - name: status
        label: Status
        widget: select
        default: defended
        options:
          - label: Defended
            value: defended
          - label: In progress
            value: ongoing
      - name: year
        label: Year
        widget: number
        value_type: int
        required: false
        hint: Year of the defence (or of the start, if in progress).
      - name: supervisors
        label: Supervisors
        widget: select
        multiple: true
        required: false
        options: *a1
        hint: Group members; they link to their profiles, and the thesis is listed on them.
      - name: guestSupervisors
        label: Other supervisors
        widget: list
        required: false
        hint: People who are not members of the group.
        field:
          name: name
          label: Name
          widget: string
      - name: support
        label: With the support of
        widget: select
        multiple: true
        required: false
        options: *a1
        hint: Group members who helped without being supervisors; they link to their profiles, and the thesis is listed on them.
      - name: guestSupport
        label: Others who supported it
        widget: list
        required: false
        hint: People who are not members of the group.
        field:
          name: name
          label: Name
          widget: string
      - name: degree
        label: Degree or programme
        widget: string
        i18n: true
        required: false
        hint: E.g. "Doctoral Programme in Information and Communication Technologies".
      - name: institution
        label: University
        widget: string
        i18n: true
        required: false
      - name: url
        label: Link
        widget: string
        required: false
        hint: The thesis in a repository, e.g. UIB’s or TDX.
      - name: tool
        label: Tool
        widget: relation
        collection: tools
        search_fields:
          - title
        value_field: "{{slug}}"
        display_fields:
          - title
        required: false
        hint: The tool the thesis developed, if it is on the Tools pages. The thesis then links to it.
  - name: courses
    label: Courses
    label_singular: Course
    description: Courses taught by members of the group, current and past.
    folder: content/courses
    extension: yaml
    format: yaml
    create: true
    i18n: true
    summary: "{{title}}"
    sortable_fields:
      - start
      - order
      - title
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Courses are listed newest first, by date; this number (lowest first) only orders courses that start in the same month.
      - name: type
        label: Type
        widget: select
        required: false
        options:
          - label: Microcredential
            value: microcredential
          - label: Master's
            value: master
          - label: Postgraduate
            value: postgraduate
          - label: Short course
            value: short
          - label: Workshop
            value: workshop
          - label: Online course
            value: online
          - label: Course
            value: other
      - name: summary
        label: Description
        widget: text
        i18n: true
        required: false
      - name: instructors
        label: Instructors
        widget: select
        multiple: true
        required: false
        options: *a1
        hint: Group members; they link to their profiles.
      - name: guestInstructors
        label: Other instructors
        widget: list
        required: false
        hint: People who are not members of the group.
        field:
          name: name
          label: Name
          widget: string
      - name: start
        label: Start
        widget: string
        required: false
        pattern:
          - ^\d{4}(-\d{2})?$
          - A year or year-month, e.g. 2027 or 2027-02
      - name: end
        label: End
        widget: string
        required: false
        pattern:
          - ^\d{4}(-\d{2})?$
          - A year or year-month, e.g. 2027 or 2027-06
      - name: onDemand
        label: On demand
        widget: boolean
        required: false
        hint: For courses without dates that are taught when someone asks for them, e.g. in-house for a company. Shown as “On demand” instead of the dates.
      - name: schedule
        label: Schedule
        widget: string
        i18n: true
        required: false
        hint: Free text, e.g. "Tuesdays and Thursdays, 16:00–18:00".
      - name: format
        label: Format
        widget: select
        required: false
        options:
          - label: In person
            value: in-person
          - label: Online
            value: online
          - label: Hybrid
            value: hybrid
      - name: languages
        label: Taught in
        widget: select
        multiple: true
        required: false
        options:
          - label: English
            value: en
          - label: Catalan
            value: ca
          - label: Spanish
            value: es
      - name: ects
        label: ECTS credits
        widget: number
        value_type: float
        required: false
      - name: hours
        label: Hours
        widget: number
        value_type: int
        required: false
        hint: Shown when there are no ECTS credits.
      - name: institution
        label: Institution
        widget: string
        i18n: true
        required: false
      - name: url
        label: Link
        widget: string
        required: false
        hint: The official information or enrolment page. Shown as a button on the course’s own page if it has one; otherwise “More information” leads here.
      - name: body
        label: Page text
        widget: markdown
        i18n: true
        required: false
        hint: Optional. With text here the course gets a page of its own on this site (programme, teaching staff, prices…), and “More information” leads to it instead of the link above.
  - name: tools
    label: Tools
    label_singular: Tool
    description: Tools the group has developed. Each one is listed, as a card with its summary, on the Tools page of Research, of Teaching, or of both, as its sections say, and has a page of its own with the full text.
    folder: content/tools
    extension: yaml
    format: yaml
    create: true
    i18n: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    summary: "{{title}}"
    sortable_fields:
      - order
      - title
    fields:
      - name: title
        label: Name
        widget: string
        i18n: true
      - name: tags
        label: Sections
        widget: select
        multiple: true
        min: 1
        default:
          - research
        hint: "Where the tool is listed: under Research, under Teaching, or both."
        options:
          - label: Research
            value: research
          - label: Teaching
            value: teaching
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Tools are listed by this number, lowest first.
      - name: summary
        label: Summary
        widget: text
        i18n: true
        required: false
        hint: One or two sentences, shown on the card and at the top of the tool’s page.
      - name: image
        label: Logo
        widget: image
        required: false
        hint: Shown small, next to the name. Square works best.
      - name: body
        label: Page text
        widget: markdown
        i18n: true
        required: false
        hint: "The tool’s own page: what it does, pictures, guides, results… An image followed by a line in italics shows the italics as its caption. A code block with the language “cite” holding a DOI of one of the group’s publications (e.g. doi:10.1002/cae.21990), or a BibTeX entry, shows a box to cite it in IEEE, APA, Chicago, BibTeX and RIS."
      - name: links
        label: Links
        widget: list
        i18n: true
        required: false
        label_singular: Link
        hint: "Shown on the tool’s page, and the first one also on its card. The first one is shown as a button, e.g. the tool itself (unless it is a GitHub link: the code alone is never the button); then a demo, the code, a paper… Each language has its own list, so the texts can be translated; if a language has none, the default language’s are shown."
        summary: "{{label}} · {{url}}"
        fields:
          - name: label
            label: Text
            widget: string
            required: false
            hint: E.g. "Try it". If empty, the site name is shown.
          - name: url
            label: URL
            widget: string
            pattern:
              - ^(https?://|mailto:)
              - A full address starting with https:// (or mailto:)
  - name: collaborators
    label: Collaborators
    label_singular: Collaborator
    description: People outside the group who work with it, shown on the team page after the members. Group members are set in site.config.yaml.
    folder: content/collaborators
    extension: yaml
    format: yaml
    create: true
    i18n: true
    slug: "{{name}}"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields:
      - order
      - name
    fields:
      - name: name
        label: Name
        widget: string
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Collaborators are listed by this number, lowest first, then by name.
      - name: role
        label: Position
        widget: string
        i18n: true
        required: false
        hint: E.g. "Associate professor".
      - name: institution
        label: Institution
        widget: string
        i18n: true
        required: false
      - name: photo
        label: Photo
        widget: image
        required: false
        hint: Square works best. Without a photo, their initials are shown.
      - name: links
        label: Links
        widget: list
        required: false
        label_singular: Link
        hint: Shown on their card, e.g. ORCID, Google Scholar, their own web page.
        summary: "{{label}} · {{url}}"
        fields:
          - name: label
            label: Text
            widget: string
            required: false
            hint: E.g. "ORCID". If empty, the site name is shown.
          - name: url
            label: URL
            widget: string
            pattern:
              - ^(https?://|mailto:)
              - A full address starting with https:// (or mailto:)
