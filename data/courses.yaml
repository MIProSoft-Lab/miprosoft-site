# Courses the group currently teaches, listed on the Courses page in this order.
# Remove a course when it is no longer offered. With no courses, the Courses
# tab is hidden.
#
# Any text can be a plain string (same in every language) or a map per
# language: { en: …, ca: …, es: … }. Missing languages fall back to the first
# language in site.config.yaml. Every field except `title` is optional.
#
#  - title: { en: …, ca: …, es: … }
#    type: master          # master | postgraduate | short | workshop | online | other
#    summary: { en: …, ca: …, es: … }   # a few sentences
#    instructors: [antonio-crespi, Jane Doe]   # member ids link to their profiles
#    start: 2026-02        # year, or year-month
#    end: 2026-06
#    schedule: { en: "Tuesdays and Thursdays, 16:00–18:00" }   # free text instead of / besides dates;
#                          # quote texts that contain commas or colons
#    format: in-person     # in-person | online | hybrid
#    languages: [ca, es]   # languages it is taught in
#    ects: 6               # or hours: 20
#    institution: Universitat de les Illes Balears
#    url: https://…        # information or enrolment

courses:
  # SAMPLE COURSE with placeholder text: replace it with your courses.
  - title:
      en: "Sample course: placeholder title"
      ca: "Curs d'exemple: títol provisional"
      es: "Curso de ejemplo: título provisional"
    type: postgraduate
    summary:
      en: This is a sample course with placeholder text, to show how courses look on the website. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
      ca: Aquest és un curs d'exemple amb text provisional, per mostrar com es veuen els cursos al web. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
      es: Este es un curso de ejemplo con texto provisional, para mostrar cómo se ven los cursos en la web. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
    instructors: [antonia-mas, antoni-mesquida]
    start: 2027-02
    end: 2027-06
    format: hybrid
    languages: [ca, es]
    ects: 6
    institution: Universitat de les Illes Balears
    url: https://www.uib.eu
