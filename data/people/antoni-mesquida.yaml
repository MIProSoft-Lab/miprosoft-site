# Content of one member's profile page that ORCID does not hold. Everything here is
# optional: an empty list or a missing key simply hides that section.
# The file name is the member's `id` in site.config.yaml.
#
# Any text field can be written either as a plain string (same in every
# language) or as a map per language, e.g.
#   title: { en: Postdoctoral researcher, ca: Investigador postdoctoral, es: Investigador postdoctoral }
# Missing languages fall back to the first language in site.config.yaml.

# Variants of the name as it appears in author lists; they are highlighted.
# Defaults to the ORCID name and "other names".
nameVariants:
  - Antoni-Lluís Mesquida Calafat
  - Antoni Lluís Mesquida Calafat

# Optional: a different section order for this profile (see site.config.yaml).
# sections: [about, publications, employment]

profile:
  # Overrides the ORCID name if set.
  name: ""
  title:
    en: ""
    ca: ""
    es: ""
  email: ""        # shown on the page; leave empty to hide
  location: ""
  photo: ""        # path inside public/, e.g. /photo.jpg
  # Extra links in addition to the ORCID "websites & social links".
  links:
  #  - { label: Google Scholar, url: https://scholar.google.com/citations?user=XXXX }

  hideLinks: [Lens, Scopus]

# Replaces the ORCID biography (which is only in one language).
about: {}
#  en: I work on ...
#  ca: Treball en ...
#  es: Trabajo en ...

# Talks not registered in ORCID. ORCID works of type "lecture-speech"
# are added automatically.
talks: []
#  - title: "Title of the talk"
#    event: "Conference name"
#    location: "Palma, Spain"
#    date: 2026-05
#    invited: true
#    url: ""

teaching: []
