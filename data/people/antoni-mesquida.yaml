#    level: { en: MSc thesis, ca: Treball de fi de màster, es: Trabajo de fin de máster }
#    title: "Thesis title"
#    years: 2025
#    role: { en: Supervisor, ca: Director, es: Director }

software: []
#  - name: my-tool
#    description: { en: Tool for ..., ca: Eina per a ..., es: Herramienta para ... }
#    url: https://github.com/you/my-tool

skills: []
