#    items: [Python, C++, R]

languages: []
#  - language: { en: Catalan, ca: Català, es: Catalán }
#    level: { en: Native, ca: Nadiu, es: Nativo }

# Corrections for this member only, applied on top of their ORCID record.
# Corrections that apply to every member (a wrong title, type or venue) go in
# data/overrides.yaml instead.
#
# Works are matched by DOI (preferred) or by ORCID put-code.
works: []
#  - doi: 10.1234/abcd
#    selected: true        # show in "Selected publications"
#  - doi: 10.1234/efgh
#    hide: true            # hide from this profile only
#  - putCode: 123456
#    title: "Corrected title"

# Affiliations (employment, education, distinctions, funding, ...) are
# matched by ORCID put-code (shown in data/orcid/<orcid>.json as "putCode").
items: []
